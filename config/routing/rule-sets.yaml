apiVersion: sbx.shtorm/1
kind: RuleSets
pre_rules:
- ip_is_private: true
  outbound: DIRECT
- protocol: dns
  action: hijack-dns
- protocol: bittorrent
  outbound: direct
post_rules:
- ip_is_private: true
  outbound: direct
- clash_mode: direct
  outbound: direct
- clash_mode: global
  outbound: 🚀 Proxy [Default]
rule_sets:
- tag: geoip-ru
  type: remote
  format: binary
  url: https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-ru.srs
  download_detour: direct
- tag: geosite-youtube
  type: remote
  format: binary
  url: https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-youtube.srs
  download_detour: direct
- tag: geosite-ru
  type: remote
  format: binary
  url: https://raw.githubusercontent.com/legiz-ru/sb-rule-sets/main/ru-bundle.srs
  download_detour: direct
- tag: geosite-google
  type: remote
  format: binary
  url: https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-google.srs
  download_detour: direct
- tag: geosite-openai
  type: remote
  format: binary
  url: https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-openai.srs
  download_detour: direct
- tag: geosite-cheburnet
  type: remote
  format: binary
  url: https://github.com/jinndi/geosite-cheburnet/releases/latest/download/geosite-cheburnet.srs
  download_detour: direct
- tag: custom-ai
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-ai.srs
- tag: custom-communication
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-communication.srs
- tag: custom-games
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-games.srs
- tag: custom-media
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-media.srs
- tag: custom-single
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-single.srs
- tag: custom-tiktok
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-tiktok.srs
- tag: custom-youtube
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-youtube.srs
- tag: custom-ru-block
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-ru-block.srs
- tag: custom-proxy
  type: local
  format: binary
  path: /etc/sing-box/rules/custom-proxy.srs
