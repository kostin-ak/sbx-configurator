[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "router-vpn-sbx"
version = "0.2.0"
description = "Declarative, testable sing-box configuration pipeline for OpenWrt routers"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
router = ["paramiko>=3.4"]
dev = ["pytest>=8"]

[project.scripts]
sbxctl = "sbx.cli:main"

[tool.setuptools.packages.find]
include = ["sbx*"]
